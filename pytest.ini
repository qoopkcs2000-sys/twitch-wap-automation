[pytest]
testpaths = tests
# Make modules under source/ importable without a "source." prefix.
# This keeps test code reading "from pages.home_page import HomePage"
# while the source layout still groups production code under source/.
pythonpath = source
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
markers =
    smoke: smoke tests
    wap: WAP (Web Application / Mobile) tests
